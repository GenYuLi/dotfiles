# herdr configuration — symlinked to ~/.config/herdr/config.toml by home-manager
# (out-of-store symlink, so herdr's own writes land in this file; commit them if
# you want to keep them). Full reference: `herdr --default-config`.
# Validate after editing: `herdr config check`; apply: `herdr server reload-config`.

[theme]
# herdr ships `gruvbox` but not sainnhe's gruvbox-material, so start from gruvbox
# and repaint it with the same variant nvim uses (background=hard,
# foreground=material — see config/nvim/lua/plugins/gruvbox.lua) and the tmux
# status bar already hardcodes.
name = "gruvbox"

[theme.custom]
sidebar_bg = "#141617"    # bg_dim  (hard)
panel_bg = "#1d2021"      # bg0     (hard)
active_row_bg = "#282828" # bg1
selection_bg = "#3c3836"  # bg3
accent = "#7daea3"        # blue — same role as the tmux NORMAL-mode segment
text = "#d4be98"          # fg0
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"

[ui]
# herdr switches to its single-column mobile layout at or below this many
# columns (default 64). The phone PWA is ~51 cols at its default 13px font, but
# pinching down to 9px gives ~74 cols, which would flip herdr back to the desktop
# layout and spend 26 of those columns on the sidebar. 80 keeps every phone font
# size in mobile layout while a normal desktop terminal stays on the desktop one.
mobile_width_threshold = 80
